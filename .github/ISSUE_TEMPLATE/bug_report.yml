name: Bug report / Zgłoś błąd
description: Something failed during installation or use.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        English or Polish is welcome. Do not post passwords, API keys, login codes, authentication files or private conversations. Security concerns: founder@kritaqo.com.
  - type: input
    id: version
    attributes:
      label: Kritaqo version / Wersja Kritaqo
      placeholder: 0.8.17-alpha.1
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system / System
      placeholder: Windows 11 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do? / Co zrobiłeś?
      description: List the clicks or actions that led to the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result / Oczekiwany wynik
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result / Co się wydarzyło?
      description: Include the error code if one was shown.
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: Optional diagnostic report / Opcjonalny raport
      description: Review the app's diagnostic report before sharing. Do not paste raw provider logs or your data folder.
